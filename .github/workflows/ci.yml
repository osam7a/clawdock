name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Run the tests
        run: ./build.ps1 -Test
      - name: Build the app
        run: ./build.ps1
      - uses: actions/upload-artifact@v7
        with:
          name: Clawdock
          path: bin/Clawdock.exe
          retention-days: 7
