name: Release

# Push a tag like v0.4.0 to publish it. The tag must match src/App/AssemblyInfo.cs, and
# CHANGELOG.md must have a section for that version.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: write     # publish the release
      id-token: write     # sign the attestation
      attestations: write # store it
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run the tests
        run: ./build.ps1 -Test
      - name: Build the app
        run: ./build.ps1
      - name: Write the release notes
        run: ./tools/release-notes.ps1 -Tag $env:GITHUB_REF_NAME -Exe bin/Clawdock.exe -Out bin/notes.md
      - name: Record where the exe came from
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: bin/Clawdock.exe
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create $env:GITHUB_REF_NAME bin/Clawdock.exe --title "Clawdock $($env:GITHUB_REF_NAME.TrimStart('v'))" --notes-file bin/notes.md
